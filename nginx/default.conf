server {
    listen 80;

    location /suma/ {
        proxy_pass http://servicio-suma:8000/;
    }

    location /resta/ {
        proxy_pass http://servicio-resta:8000/;
    }

    location /multiplicacion/ {
        proxy_pass http://servicio-multiplicacion:8000/;
    }

    location /division/ {
        proxy_pass http://servicio-division:8000/;
    }
}
version: "3.9"

services:
  gateway:
    image: nginx:alpine
    ports:
    - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - servicio-suma
      - servicio-resta
      - servicio-multiplicacion
      - servicio-division

  servicio-suma:
    build: ./servicio-suma
  servicio-resta:
    build: ./servicio-resta
  servicio-multiplicacion:
    build: ./servicio-multiplicacion
  servicio-division:
    build: ./servicio-division